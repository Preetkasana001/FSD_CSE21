        // make calculator using arrow fn 
        const calculator= (a,b,operation) => {
            switch(operation){
                case "sum":
                    return sum(a,b);
                case "sub":
                    return sub(a,b);
                case "mul":
                    return mul(a,b);
                case "div":
                    return div(a,b);
                default:
                    return "Invalid operation";
            }
        }

        const sum= (a,b) => a+b;
        const sub= (a,b) => a-b;
        const mul= (a,b) => a*b;
        const div= (a,b) => a/b;
     
    let a = Number(prompt("Enter first number:"));
    let b = Number(prompt("Enter second number:"));

    let operation = prompt("Enter operation (sum, sub, mul, div):");


    let result = calculator(a, b, operation);


   
    document.write("Result: " + result);
